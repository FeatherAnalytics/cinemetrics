name: Camera (Update Data)

on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch: {}

# Seeds are append-only and the job pushes to final-cut, so two overlapping runs
# (cron plus a manual dispatch) would race on the same append and push. Queue
# instead of cancelling: a half-finished run has already appended locally, and
# cancelling it mid-push is worse than letting it land.
concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write
  # `Trigger deploy` dispatches deploy.yml, which needs actions:write. Declaring
  # `permissions` at all drops every unlisted scope to none, so contents:write
  # alone made that step 403 while the rest of the pipeline succeeded.
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          prune-cache: true
      - run: uv sync
      - name: Run update pipeline
        run: uv run python scripts/update.py
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          LETTERBOXD_USER: ${{ secrets.LETTERBOXD_USER }}
      # Deliberately NOT gated on new watches. Nothing this script does depends on
      # one: TMDB's popular and top-rated lists move nightly, and the committed
      # seed holds thousands of rows still waiting for the OMDb half they never
      # got, which only another run can fill. Behind the gate it ran on about half
      # of nights -- update.py returns before writing anything when the RSS feed
      # is unchanged, so `git diff` was clean and this was skipped -- and the
      # retry backlog could not drain faster than it grew.
      - name: Fetch candidates
        run: uv run python scripts/fetch_candidates.py
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      # Reads the candidate seed as well as update.py's output, so it must run
      # after both. This is the single gate for everything below.
      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # update.py runs dbt deps, dbt build and export_web itself -- but returns
      # before all three when there is no new watch. On a night when candidates
      # are the only thing that moved, nothing has built the models they feed,
      # and the scoped `--select candidate_enrichment+` that used to validate
      # them cannot stand alone: dim_candidate reads dim_film and dim_watchlist
      # reads stg_watchlist, neither of which that selector reaches. On a fresh
      # database it fails with `Table with name dim_film does not exist`.
      #
      # So build everything. It also replaces the old scoped validation outright,
      # since a full build runs those same unique and not_null tests and every
      # other one besides. On a night that did have new watches this repeats
      # what update.py already did, which is a second or so and idempotent.
      - name: Build the models and export
        if: steps.diff.outputs.changed == 'true'
        run: |
          cd transform
          uv run dbt deps --profiles-dir .
          uv run dbt build --profiles-dir .
          cd ..
          uv run python scripts/export_web.py
      # Runs after the build above because it reads dim_film.poster_path out of
      # the DuckDB file that build produces. It used to sit behind update.py for
      # the same reason, which held only on nights update.py got as far as
      # building.
      #
      # The second script covers the case the first cannot see: a film that
      # already has a slice but whose art changed, which only a hand edit to
      # poster_overrides.csv can cause. Two image fetches, and on the usual run
      # both scripts find nothing and leave the seed byte-identical.
      #
      # Byte-identical, not merely equivalent: update.py has already written the
      # new film's slice in numeric tmdb_id order, so neither script here has a
      # row to add or a row to move, and neither writes at all unless it does.
      # Before that ordering held, a run that added one film left the seed out of
      # order, the first script re-sorted all 676 rows, and this gate reported a
      # repair every night.
      - name: Repair any missing or stale poster slices
        id: slices
        if: steps.diff.outputs.changed == 'true'
        run: |
          before=$(sha256sum transform/seeds/poster_slices.csv)
          uv run python scripts/backfill_poster_slices.py --apply
          uv run python scripts/reslice_overridden_posters.py --apply
          after=$(sha256sum transform/seeds/poster_slices.csv)
          if [ "$before" = "$after" ]; then
            echo "repaired=false" >> "$GITHUB_OUTPUT"
          else
            echo "repaired=true" >> "$GITHUB_OUTPUT"
          fi
      # A repaired slice has to be validated and exported by the same run that
      # commits it, and neither happened. The repair wrote the seed after
      # update.py had already built and exported, and the only dbt call left in
      # the job selects candidate_enrichment+, which contains no poster_slices,
      # no stg_poster_slices and no dim_film. So the seed reached final-cut with no
      # dbt node having read it -- its unique and not_null tests never saw the
      # new rows -- and cinemetrics.json was committed beside a slice it did not
      # carry, leaving a blank stripe on the barcode until the next day's run.
      #
      # Both steps are skipped on the normal path, where the repair finds
      # nothing missing and leaves the seed byte-identical.
      - name: Rebuild the models a repaired slice feeds
        if: steps.slices.outputs.repaired == 'true'
        run: cd transform && uv run dbt build --profiles-dir . --select poster_slices+
      - name: Re-export web JSON with the repaired slices
        if: steps.slices.outputs.repaired == 'true'
        run: uv run python scripts/export_web.py
      # After the build above, so dim_candidate is current when the candidate
      # count is read.
      - name: Refresh doc figures
        if: steps.diff.outputs.changed == 'true'
        run: uv run python scripts/update_doc_stats.py
      - name: Train embeddings
        if: steps.diff.outputs.changed == 'true'
        run: uv run python scripts/train_embeddings.py
      - name: Upload to R2
        if: steps.diff.outputs.changed == 'true'
        run: uv run python scripts/upload_r2.py
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transform/seeds/film_log.csv transform/seeds/film_enrichment.csv transform/seeds/candidate_enrichment.csv transform/seeds/poster_slices.csv web/public/data/cinemetrics.json
          # Figures quoted in the docs move with the data, so they land in the
          # same commit. overview.md feeds the published dbt docs landing page.
          git add docs/ARCHITECTURE.md transform/models/overview.md
          git commit -m "data: update from Letterboxd RSS"
          git push
      - name: Trigger deploy
        if: steps.diff.outputs.changed == 'true'
        run: gh workflow run deploy.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
