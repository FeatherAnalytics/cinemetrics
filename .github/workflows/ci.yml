name: Lights (CI)

on:
  pull_request:
    branches: [final-cut]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      # Exact version, not a floating major: setup-uv stopped publishing moving
      # major tags after v7, so `@v9` does not resolve.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          # v9 flipped this default to false. Left off, the uv cache grows
          # unbounded and evicts the npm caches the web jobs rely on.
          prune-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web

  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          prune-cache: true
      - run: uv sync
      - run: uv run dbt deps --profiles-dir .
        working-directory: transform
      - run: uv run dbt build --profiles-dir .
        working-directory: transform
      # pytest runs here rather than in `lint` on purpose: tests/test_doc_stats.py
      # asserts against the built marts and skips itself when the DuckDB file is
      # absent, so running it before dbt would quietly test nothing.
      - run: uv run pytest
      - name: Check doc figures match the data
        run: uv run python scripts/update_doc_stats.py --check

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: /cinemetrics
