version: 2

models:
  - name: dim_film
    description: >
      One row per film, keyed by tmdb_id. Title/year come from the ratings log;
      attributes come from the enrichment seed — TMDB (genres, keywords, runtime,
      budget, revenue) and OMDb (Metascore, Rotten Tomatoes, IMDb, box office,
      director, cast).
    columns:
      - name: tmdb_id
        description: TMDB film identifier — the primary film key.
        tests: [unique, not_null]
      - name: imdb_id
        description: IMDb id (tt#######) — kept for external linking.
        # Letterboxd links depend on imdb_id; warn (not error) on coverage gaps.
        tests:
          - not_null:
              config:
                severity: warn
      - name: title
        tests: [not_null]

  - name: fct_watches
    description: >
      One row per watch event, from the consolidated ratings log (pre-Letterboxd
      history plus Letterboxd, with new watches appended from the Letterboxd feed).
    columns:
      - name: watch_id
        tests: [unique, not_null]
      - name: tmdb_id
        description: Foreign key to dim_film.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_film')
                field: tmdb_id
      - name: imdb_id
        description: IMDb id — kept for external linking.
      - name: watched_date
        tests: [not_null]

  - name: dim_candidate
    description: >
      One row per candidate film (recommendation pool, not yet watched). Keyed by
      tmdb_id and mutually exclusive with dim_film.
    columns:
      - name: tmdb_id
        description: TMDB film identifier — the primary candidate key.
        tests: [unique, not_null]

  - name: dim_watchlist
    description: >
      One row per film on the Letterboxd watchlist, with the date it was added and
      attributes joined from the enrichment seeds. A SNAPSHOT, not history —
      removals are recorded nowhere, so time-to-watch and conversion cannot be
      derived from it. Not mutually exclusive with dim_film: Letterboxd leaves a
      watched film on the list until it is removed by hand, so check `watched`
      before calling this a backlog.
    columns:
      - name: tmdb_id
        description: TMDB film identifier — the primary watchlist key.
        tests: [unique, not_null]
      - name: added_date
        description: Date the film was added to the watchlist.
        tests: [not_null]
      - name: watched
        description: >
          True when the film also appears in fct_watches — on the list but already
          seen. Never null.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: genres
        description: >
          Comma-separated genre names. Backfilled for the whole list by
          scripts/enrich_watchlist.py; a null here means TMDB has no record for
          the film, which would leave it out of every watchlist chart.
        tests:
          - not_null:
              config:
                severity: warn
