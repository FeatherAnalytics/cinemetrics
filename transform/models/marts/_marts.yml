version: 2

models:
  - name: dim_film
    description: >
      One row per film, keyed by tmdb_id. Title/year come from the ratings log;
      attributes come from the enrichment seed — TMDB (genres, keywords, runtime,
      budget, revenue) and OMDb (Metascore, Rotten Tomatoes, IMDb, box office,
      director, cast).
    columns:
      - name: tmdb_id
        description: TMDB film identifier — the primary film key.
        tests: [unique, not_null]
      - name: imdb_id
        description: IMDb id (tt#######) — kept for external linking.
        tests:
          - not_null:
              config:
                severity: warn
      - name: title
        description: Film title from the ratings log.
        tests: [not_null]
      - name: release_year
        description: Release year from the ratings log.
      - name: liked
        description: >
          Film-level like (the heart). Three-state: true/false/NULL, where NULL
          means unknown (pre-Letterboxd films), not "not liked". Aggregated from
          the per-watch liked via bool_or, so one Letterboxd watch determines it.
      - name: runtime_min
        description: Runtime in minutes from the enrichment seed.
      - name: genres
        description: Comma-separated genre names, canonical spelling (Sci-Fi, not Science Fiction).
      - name: keywords
        description: Comma-separated TMDB keyword names.
      - name: budget
        description: Production budget in USD from TMDB. NULL when unknown.
      - name: revenue
        description: Worldwide box office revenue in USD from TMDB. NULL when unknown.
      - name: director
        description: Comma-separated director names from OMDb.
      - name: actors
        description: Comma-separated lead actors from OMDb (top four billed).
      - name: metascore
        description: Metacritic score (0–100) from OMDb. NULL when OMDb has none.
      - name: rt_rating
        description: Rotten Tomatoes score (0–100) from OMDb. NULL when OMDb has none.
      - name: imdb_rating
        description: IMDb user rating (0.0–10.0) from OMDb.
      - name: imdb_votes
        description: IMDb vote count from OMDb.
      - name: box_office
        description: Domestic box office in USD from OMDb. NULL when unavailable.
      - name: production_countries
        description: Comma-separated ISO 3166-1 alpha-2 country codes.
      - name: rated
        description: MPAA content rating (G/PG/PG-13/R/NC-17/Not Rated) from OMDb.
      - name: original_language
        description: TMDB original language as ISO 639-1 code.
      - name: poster_path
        description: >
          TMDB poster image path, e.g. "/abc123.jpg". NULL when TMDB serves no
          poster. The curated choice from stg_poster_overrides where there is one,
          the enrichment seed's value otherwise — the single source of truth for
          a film's art.
      - name: poster_slice
        description: >
          20 RGB stops sampled down the film's poster, packed as 120 hex
          characters. Drawn by the landing-page barcode. NULL when the film has
          no poster.
      - name: collection
        description: >
          Umbrella franchise name when mapped by franchise_mapping(), raw TMDB
          collection otherwise. The grouping the site exposes as "franchise runs".

  - name: fct_watches
    description: >
      One row per watch event, from the consolidated ratings log (pre-Letterboxd
      history plus Letterboxd, with new watches appended from the Letterboxd feed).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [tmdb_id, watched_date, rating_100, is_rewatch]
    columns:
      - name: watch_id
        description: Row number over all watches, deterministic across rebuilds.
      - name: tmdb_id
        description: Foreign key to dim_film.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_film')
                field: tmdb_id
      - name: imdb_id
        description: IMDb id — kept for external linking.
      - name: watched_date
        description: Date the film was watched.
        tests: [not_null]
      - name: rating_100
        description: >
          Personal rating on the 0–100 scale. The authoritative scale;
          star_rating is 0–5, and the factor is exactly 20, measured across
          the rows that arrived carrying both values.
      - name: star_rating
        description: >
          Personal rating on the 0–5 scale. Derived as rating_100 / 20 where
          the source did not supply it; the raw value where it did.
      - name: is_rewatch
        description: >
          The rewatch flag exactly as the source recorded it. False for all 129
          pre-Letterboxd rows because the Google Sheet had no such field — which
          is NOT the same as those viewings having been first watches. Left
          untouched so the published "flagged rewatches" figure keeps meaning
          what it says; use is_rewatch_effective to answer whether a viewing was
          a rewatch.
      - name: is_return
        description: >
          True when an earlier watch of the same film exists in the dataset.
          Purely ordinal, so it is answerable for the sheet era too. Narrower
          than a rewatch: a film whose only row is flagged returned to a viewing
          that predates the data, and this cannot see that.
        tests:
          - not_null
      - name: is_rewatch_effective
        description: >
          The union of is_rewatch and is_return, and the column the dashboard
          filters on. Neither half is sufficient alone — the flag misses every
          sheet-era return, the order misses a first-row film whose original
          viewing predates the dataset. Still false for a sheet-era row that is
          its film's first appearance, which is genuinely unknowable.
        tests:
          - not_null
      - name: liked
        description: >
          Three-state: true/false/NULL. NULL means unknown (pre-Letterboxd rows),
          not "not liked". Filter liked is not null before computing affection rate.
      - name: film_title
        description: Denormalized title from the ratings log, for display.
      - name: film_year
        description: Denormalized release year from the ratings log.

  - name: dim_candidate
    description: >
      One row per candidate film (recommendation pool, not yet watched). Keyed by
      tmdb_id and mutually exclusive with dim_film. Excludes rows whose OMDb Type
      is not "movie" (omdb_status = not_a_film).
    columns:
      - name: tmdb_id
        description: TMDB film identifier — the primary candidate key.
        tests: [unique, not_null]
      - name: imdb_id
        description: IMDb id (tt#######) — kept for external linking.
      - name: title
        description: Film title from the TMDB detail payload.
      - name: release_year
        description: Release year derived from TMDB release_date.
      - name: runtime_min
        description: Runtime in minutes from the enrichment seed.
      - name: genres
        description: Comma-separated genre names, canonical spelling (Sci-Fi, not Science Fiction).
      - name: keywords
        description: Comma-separated TMDB keyword names.
      - name: budget
        description: Production budget in USD from TMDB. NULL when unknown.
      - name: revenue
        description: Worldwide box office revenue in USD from TMDB. NULL when unknown.
      - name: director
        description: Comma-separated director names from OMDb.
      - name: actors
        description: Comma-separated lead actors from OMDb (top four billed).
      - name: metascore
        description: Metacritic score (0–100) from OMDb. NULL when OMDb has none.
      - name: rt_rating
        description: Rotten Tomatoes score (0–100) from OMDb. NULL when OMDb has none.
      - name: imdb_rating
        description: IMDb user rating (0.0–10.0) from OMDb.
      - name: imdb_votes
        description: IMDb vote count from OMDb.
      - name: box_office
        description: Domestic box office in USD from OMDb. NULL when unavailable.
      - name: production_countries
        description: Comma-separated ISO 3166-1 alpha-2 country codes.
      - name: rated
        description: MPAA content rating from OMDb.
      - name: original_language
        description: TMDB original language as ISO 639-1 code.
      - name: collection
        description: TMDB collection name, if any.
      - name: poster_path
        description: >
          TMDB poster image path, e.g. "/abc123.jpg". NULL when TMDB serves no
          poster. Same convention as dim_film.poster_path.
      - name: source
        description: >
          How this candidate entered the pool: similar, popular, top_rated,
          or legacy (pre-provenance rows).

  - name: bridge_film_genre
    description: >
      One row per (tmdb_id, genre), splitting the comma-separated genres from
      dim_film and dim_candidate into individual rows for join-based analysis.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [tmdb_id, genre]
    columns:
      - name: tmdb_id
        description: TMDB film identifier.
      - name: genre
        description: A single genre name (e.g. "Drama", "Sci-Fi").
      - name: is_candidate
        description: True for candidates, false for watched films.

  - name: bridge_film_person
    description: >
      One row per (tmdb_id, person, role) from watched films only. Candidates
      are excluded because OMDb's top-four actor list would dominate.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [tmdb_id, person, role]
    columns:
      - name: tmdb_id
        description: TMDB film identifier.
      - name: person
        description: Person name as credited.
      - name: role
        description: "'director' or 'actor'."

  - name: fct_taste_by_period
    description: >
      One row per calendar quarter: aggregate taste metrics over time for
      tracking drift in viewing habits, ratings, and genre preferences.
    columns:
      - name: period
        description: Calendar quarter, e.g. "2020-Q1".
        tests: [unique, not_null]
      - name: watches
        description: Total watch events in the quarter.
        tests: [not_null]
      - name: films
        description: Distinct films watched in the quarter.
      - name: mean_rating_100
        description: Mean rating on the 0-100 scale.
      - name: rewatch_share
        description: >
          Share of watches that were rewatches, using is_rewatch_effective over
          the answerable denominator (liked is not null or is_return).
      - name: liked_share
        description: Share of watches that were liked, over rows that recorded liked.
      - name: critic_delta
        description: Mean of (rating_100 - metascore) where both are present.
      - name: horror_share
        description: Share of watches carrying the Horror genre.
      - name: thriller_share
        description: Share of watches carrying the Thriller genre.
      - name: drama_share
        description: Share of watches carrying the Drama genre.
      - name: comedy_share
        description: Share of watches carrying the Comedy genre.
      - name: adventure_share
        description: Share of watches carrying the Adventure genre.

  - name: dim_watchlist
    description: >
      One row per film on the Letterboxd watchlist, with the date it was added and
      attributes joined from the enrichment seeds. A SNAPSHOT, not history —
      removals are recorded nowhere, so time-to-watch and conversion cannot be
      derived from it. Not mutually exclusive with dim_film: Letterboxd leaves a
      watched film on the list until it is removed by hand, so check `watched`
      before calling this a backlog.
    columns:
      - name: tmdb_id
        description: TMDB film identifier — the primary watchlist key.
        tests: [unique, not_null]
      - name: imdb_id
        description: IMDb id (tt#######) — kept for external linking.
      - name: title
        description: Film title from the watchlist export.
      - name: release_year
        description: Release year from the watchlist export.
      - name: release_date
        description: Full release date from the candidate seed, for the release-date barcode.
      - name: added_date
        description: Date the film was added to the watchlist.
        tests: [not_null]
      - name: watched
        description: >
          True when the film also appears in fct_watches — on the list but already
          seen. Never null.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: genres
        description: >
          Comma-separated genre names. Backfilled by scripts/enrich_watchlist.py;
          NULL means TMDB has no record for the film.
        tests:
          - not_null:
              config:
                severity: warn
      - name: keywords
        description: Comma-separated TMDB keyword names.
      - name: runtime_min
        description: Runtime in minutes.
      - name: director
        description: Comma-separated director names from OMDb.
      - name: actors
        description: Comma-separated lead actors from OMDb.
      - name: rated
        description: MPAA content rating from OMDb.
      - name: metascore
        description: Metacritic score (0-100) from OMDb.
      - name: rt_rating
        description: Rotten Tomatoes score (0-100) from OMDb.
      - name: imdb_rating
        description: IMDb user rating (0.0-10.0) from OMDb.
      - name: imdb_votes
        description: IMDb vote count from OMDb.
      - name: tmdb_rating
        description: TMDB audience score (0.0-10.0).
      - name: tmdb_votes
        description: TMDB vote count behind tmdb_rating.
      - name: production_countries
        description: Comma-separated ISO 3166-1 alpha-2 country codes.
      - name: original_language
        description: TMDB original language as ISO 639-1 code.
      - name: collection
        description: TMDB collection name, if any.
