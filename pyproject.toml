[project]
name = "cinemetrics"
version = "0.1.0"
description = "An end-to-end analytics pipeline over seven years of personal film-watching data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "dbt-duckdb>=1.9",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "boto3>=1.34",
    # Parsing Letterboxd film pages for their outbound TMDB/IMDb links. Regex over
    # HTML is brittle here — attribute order in the anchor tags is not guaranteed.
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    # Verify TLS against the OS trust store, not just certifi's bundled roots.
    # requests uses certifi, which does not contain the private CA a
    # TLS-intercepting corporate proxy signs with, so every TMDB and OMDb call
    # fails verification on such a machine. Injected lazily in ingest/http.py, so
    # it is inert wherever the bundled roots already work.
    "truststore>=0.9",
    # Sampling poster art down to the colour column the landing-page barcode
    # draws. Only used at ingest time; nothing at request time touches images.
    "pillow>=11",
]

[tool.setuptools.packages.find]
include = ["recommend*", "ingest*", "transform*"]

[tool.pytest.ini_options]
pythonpath = "."

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "jupyter>=1.1",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
