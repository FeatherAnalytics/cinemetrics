[project]
name = "cinemetrics"
version = "0.1.0"
description = "An end-to-end analytics pipeline over seven years of personal film-watching data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "dbt-duckdb>=1.9",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "scipy>=1.11",
    "boto3>=1.34",
    # Parsing Letterboxd film pages for their outbound TMDB/IMDb links. Regex over
    # HTML is brittle here — attribute order in the anchor tags is not guaranteed.
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    # Verify TLS against the OS trust store, not just certifi's bundled roots.
    # requests uses certifi, which does not contain the private CA a
    # TLS-intercepting corporate proxy signs with, so every TMDB and OMDb call
    # fails verification on such a machine. Injected lazily in ingest/http.py, so
    # it is inert wherever the bundled roots already work.
    "truststore>=0.9",
    # Sampling poster art down to the colour column the landing-page barcode
    # draws. Only used at ingest time; nothing at request time touches images.
    "pillow>=11",
    "defusedxml>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest", "recommend"]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = "."

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pyright>=1.1.380",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "PTH", "PT", "RUF", "PERF", "C4"]
# Film titles contain legitimate Unicode hyphens and quotes from TMDB/OMDb
ignore = ["RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PERF401"]
# uv subprocess calls are intentional and trusted
"scripts/update.py" = ["S603", "S607"]
# md5 is used for cache keys, not security
"scripts/train_embeddings.py" = ["S324"]
# SQL strings built from constant column names, not user input
"scripts/update_doc_stats.py" = ["S608"]

[tool.pyright]
include = ["ingest", "recommend", "scripts"]
typeCheckingMode = "basic"
pythonVersion = "3.11"
